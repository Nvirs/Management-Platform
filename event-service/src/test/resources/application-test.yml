spring:
  datasource:
    url: jdbc:h2:mem:eventservice;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  # JJWT rejects HMAC keys shorter than 256 bits, so this must stay >= 32 bytes.
  secret: test-only-secret-key-for-event-service-unit-tests-1234
