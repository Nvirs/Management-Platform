# postgres is stateful, so it's a StatefulSet 
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: eventplatform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      # Mirrors infra/docker-compose.yml's postgres hardening: cap_drop ALL,
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          # further down, Postgres has no use for the rest of the ConfigMap.
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: eventplatform-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: eventplatform-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db_password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "eventplatform"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "eventplatform"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: secrets
          secret:
            secretName: eventplatform-secrets
            items:
              - key: db_password
                path: db_password
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
