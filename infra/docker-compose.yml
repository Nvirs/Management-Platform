services:
  postgres:
    image: postgres:16
    container_name: eventplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eventplatform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eventplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
