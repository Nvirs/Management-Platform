secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt

services:
  postgres:
    image: postgres:16
    container_name: eventplatform-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # root to the postgres user on startup (via gosu/su)
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      POSTGRES_DB: ${DB_NAME:-eventplatform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eventplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eventplatform-rabbitmq
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
    secrets:
      - rabbitmq_password
    entrypoint:
      - sh
      - -c
      - 'export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)"; exec docker-entrypoint.sh rabbitmq-server'
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  auth-service:
    build:
      context: ../auth-service
    container_name: eventplatform-auth
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      PORT: ${AUTH_PORT:-8081}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eventplatform}
      DB_USER: ${DB_USER:-postgres}
    secrets:
      - db_password
      - jwt_secret
    ports:
      - "${AUTH_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  event-service:
    build:
      context: ../event-service
    container_name: eventplatform-event
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      PORT: ${EVENT_PORT:-8082}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eventplatform}
      DB_USER: ${DB_USER:-postgres}
    secrets:
      - db_password
      - jwt_secret
    ports:
      - "${EVENT_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  registration-service:
    build:
      context: ../registration-service
    container_name: eventplatform-registration
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      PORT: ${REGISTRATION_PORT:-8083}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eventplatform}
      DB_USER: ${DB_USER:-postgres}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:-http://event-service:8082}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      PYTHONDONTWRITEBYTECODE: "1"
    secrets:
      - db_password
      - jwt_secret
      - rabbitmq_password
    ports:
      - "${REGISTRATION_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      event-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  notification-service:
    build:
      context: ../notification-service
    container_name: eventplatform-notification
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      PORT: ${NOTIFICATION_PORT:-8084}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
    secrets:
      - rabbitmq_password
    ports:
      - "${NOTIFICATION_PORT:-8084}:8084"
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres-data:
  rabbitmq-data:
